<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <radialGradient id="bg_grad_netra" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <linearGradient id="hud_grad_netra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Deep Combat Canvas Background -->
  <rect width="640" height="420" fill="url(#bg_grad_netra)"/>

  <!-- Tactical Radar HUD Grid -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.2">
    <line x1="0" y1="70" x2="640" y2="70" stroke-dasharray="4 4"/>
    <line x1="0" y1="140" x2="640" y2="140" stroke-dasharray="4 4"/>
    <line x1="0" y1="210" x2="640" y2="210"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke-dasharray="4 4"/>
    <line x1="0" y1="350" x2="640" y2="350" stroke-dasharray="4 4"/>

    <line x1="80" y1="0" x2="80" y2="420" stroke-dasharray="4 4"/>
    <line x1="160" y1="0" x2="160" y2="420" stroke-dasharray="4 4"/>
    <line x1="240" y1="0" x2="240" y2="420" stroke-dasharray="4 4"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke-dasharray="4 4"/>
    <line x1="480" y1="0" x2="480" y2="420" stroke-dasharray="4 4"/>
    <line x1="560" y1="0" x2="560" y2="420" stroke-dasharray="4 4"/>

    <!-- Concentric Radar Range Rings -->
    <circle cx="320" cy="210" r="80" fill="none"/>
    <circle cx="320" cy="210" r="150" fill="none" stroke-dasharray="6 6"/>
  </g>

  <!-- IAF Roundel Emblem (Top Right) -->
  <g transform="translate(570, 48)">
    <circle cx="0" cy="0" r="26" fill="#f97316"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
    <circle cx="0" cy="0" r="10" fill="#16a34a"/>
    <circle cx="0" cy="0" r="4" fill="#1e3a8a"/>
  </g>

  <!-- Technical Telemetry Labels -->
  <text x="32" y="42" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="1.5">IAF AIR FLEET DOSSIER // RECON ID: NETRA</text>
  <text x="32" y="60" fill="#94a3b8" font-family="monospace" font-size="9" letter-spacing="1">SYSTEM STATUS: COMBAT DEPLOYED // OFFLINE CACHED</text>

  <!-- Main Aircraft Silhouette Graphic -->
  <g transform="translate(-10, -45) scale(0.95)">
    
        <!-- ERJ-145 Jet platform -->
        <rect x="120" y="278" width="380" height="44" rx="22" fill="#1e293b" stroke="#a855f7" stroke-width="3"/>
        <!-- Swept Wings -->
        <path d="M270,300 L320,130 L350,130 L330,300 Z" fill="#334155" stroke="#a855f7" stroke-width="2"/>
        <path d="M270,300 L320,470 L350,470 L330,300 Z" fill="#334155" stroke="#a855f7" stroke-width="2"/>
        <!-- Dorsal Active Electronically Scanned Array (AESA) Radar Antenna -->
        <rect x="240" y="290" width="170" height="20" rx="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
        <line x1="245" y1="300" x2="405" y2="300" stroke="#ffffff" stroke-width="3" stroke-dasharray="6 4"/>
        <!-- Rear Mounted Turbofans -->
        <rect x="410" y="255" width="45" height="18" rx="4" fill="#64748b"/>
        <rect x="410" y="327" width="45" height="18" rx="4" fill="#64748b"/>
        <!-- Cockpit Glass -->
        <ellipse cx="135" cy="300" rx="12" ry="16" fill="#0284c7" opacity="0.85"/>
        
  </g>

  <!-- Target Acquisition Crosshairs -->
  <g stroke="#a855f7" stroke-width="1.5" opacity="0.7">
    <line x1="320" y1="190" x2="320" y2="200"/>
    <line x1="320" y1="220" x2="320" y2="230"/>
    <line x1="300" y1="210" x2="310" y2="210"/>
    <line x1="330" y1="210" x2="340" y2="210"/>
  </g>

  <!-- Lower Tactical Card Overlay -->
  <rect x="24" y="330" width="592" height="72" rx="12" fill="#020617" fill-opacity="0.85" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="358" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="16" letter-spacing="1">DRDO / EMBRAER NETRA AEW&C</text>
  <text x="42" y="378" fill="#a855f7" font-family="monospace" font-weight="bold" font-size="11">EYE IN THE SKY • AIRBORNE EARLY WARNING & BATTLE MGMT</text>
  <text x="42" y="392" fill="#cbd5e1" font-family="monospace" font-size="10">833 KM/H • 240° AESA RADAR • IFF & TACTICAL DATA LINKS</text>

  <!-- Corner Brackets for HUD Frame -->
  <path d="M16,24 L16,16 L24,16" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M624,24 L624,16 L616,16" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M16,396 L16,404 L24,404" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M624,396 L624,404 L616,404" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>